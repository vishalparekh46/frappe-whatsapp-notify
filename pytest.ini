[pytest]
testpaths = frappe_whatsapp_notify/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring a live Frappe/ERPNext instance
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
